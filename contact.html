<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lolo Treats | Contact Us</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="container nav-content">
            <a href="index.html" class="logo">Lolo Treats</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>

                    <li class="dropdown">
                        <a href="shop.html" class="dropdown-toggle">Products <i class="fas fa-caret-down"></i></a>
                        <ul class="dropdown-menu">
                            <li><a href="shop.html#meals">Fresh Meals</a></li>
                            <li><a href="shop.html#treats">Training Treats</a></li>
                            <li><a href="shop.html#supplements">Supplements</a></li>
                        </ul>
                    </li>
                    
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content" id="main-content">
        <div class="container">
            <h2>Get In Touch</h2>
            <div class="contact-form-section">
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>

                    <button type="submit" class="btn-primary">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2025 Lolo Treats. All rights reserved. | Made with <i class="fas fa-heart" style="color: #FF7043;"></i></p>
            <ul class="social-links">
                <li><a href="#"><i class="fab fa-facebook-f"></i></a></li>
                <li><a href="#"><i class="fab fa-instagram"></i></a></li>
                <li><a href="#"><i class="fab fa-twitter"></i></a></li>
            </ul>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('main-content').classList.add('fade-in');
        });
    </script>
</body>
</html>
